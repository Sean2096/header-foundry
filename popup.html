<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Header Foundry</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <h1>Header Foundry</h1>
        </div>
        <div class="telemetry">
          <div><strong id="targetCount">00</strong><span>页面规则</span></div>
          <div><strong id="activeCount">00</strong><span>启用 Header</span></div>
        </div>
      </header>

      <main>
        <section class="targets-section" aria-labelledby="targetListTitle">
          <div class="section-heading list-heading">
            <div>
              <h2 id="targetListTitle">页面规则</h2>
            </div>
            <div class="section-actions">
              <button id="toggleBulkMode" class="secondary-button" type="button">批量管理</button>
              <button id="clearAll" class="danger-button" type="button">清空全部</button>
              <button id="openComposer" class="primary-button" type="button">＋ 新增规则</button>
            </div>
          </div>

          <div id="emptyState" class="empty-state">
            <div>
              <strong>还没有页面规则</strong>
              <p>在下方创建一条页面 URL 规则。</p>
            </div>
          </div>
          <div id="bulkActions" class="bulk-actions" hidden>
            <label class="bulk-select-all">
              <input id="selectAllTargets" type="checkbox" />
              <span>全选页面规则</span>
            </label>
            <div class="bulk-selection"><b id="selectedTargetCount">00</b><span>已选择</span></div>
            <div class="bulk-buttons">
              <button id="enableSelected" type="button">启用所选</button>
              <button id="disableSelected" type="button">停用所选</button>
              <button id="invertSelected" type="button">反转状态</button>
            </div>
          </div>
          <div id="targetList" class="target-list" aria-live="polite"></div>
        </section>

        <section id="composerPanel" class="composer" aria-labelledby="composerTitle" hidden>
          <div class="section-heading composer-heading">
            <div>
              <h2 id="composerTitle">新增页面规则</h2>
            </div>
            <button id="closeComposer" class="icon-close" type="button" aria-label="收起新增规则表单">×</button>
          </div>

          <form id="targetForm">
            <label class="url-field">
              <span>页面 URL FILTER</span>
              <div class="url-input-wrap">
                <input id="urlFilter" name="urlFilter" required value="||httpbin.org/" placeholder="||api.example.com/" spellcheck="false" />
                <button id="useCurrentPage" class="current-page-button" type="button">使用当前页面</button>
              </div>
              <small><code>||example.com/</code> 匹配页面地址，页面内所有后端请求都会应用规则</small>
            </label>

            <div class="batch-bar">
              <div>
                <span>批量 Header</span>
                <b id="draftCount">01</b>
              </div>
              <button id="addHeaderRow" class="mini-button" type="button"><span>＋</span> 添加一行</button>
            </div>

            <div class="batch-columns" aria-hidden="true">
              <span>#</span><span>位置</span><span>方法</span><span>操作</span><span>HEADER 名称</span><span>HEADER 值</span><span></span>
            </div>
            <div id="batchRows" class="batch-rows"></div>

            <button class="forge-button" type="submit">应用这一批规则</button>
          </form>
        </section>
      </main>

    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
