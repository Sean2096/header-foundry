<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Header Foundry</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <p class="eyebrow"><span class="signal"></span>NETWORK RULE WORKBENCH</p>
          <h1>HEADER <em>FOUNDRY</em></h1>
        </div>
        <div class="telemetry">
          <div><strong id="targetCount">00</strong><span>TARGETS</span></div>
          <i></i>
          <div><strong id="activeCount">00</strong><span>LIVE RULES</span></div>
        </div>
      </header>

      <main>
        <section class="composer" aria-labelledby="composerTitle">
          <div class="section-heading">
            <div class="index">01</div>
            <div>
              <p>RULE COMPOSER</p>
              <h2 id="composerTitle">按页面 URL 批量配置</h2>
            </div>
          </div>

          <form id="targetForm">
            <label class="url-field">
              <span>页面 URL FILTER</span>
              <div class="url-input-wrap">
                <b aria-hidden="true">⌁</b>
                <input id="urlFilter" name="urlFilter" required value="||httpbin.org/" placeholder="||api.example.com/" spellcheck="false" />
                <button id="useCurrentPage" class="current-page-button" type="button">使用当前页面</button>
              </div>
              <small><code>||example.com/</code> 匹配页面地址，页面内所有后端请求都会应用规则</small>
            </label>

            <div class="batch-bar">
              <div>
                <span>BATCH HEADERS</span>
                <b id="draftCount">01</b>
              </div>
              <button id="addHeaderRow" class="mini-button" type="button"><span>＋</span> 添加一行</button>
            </div>

            <div class="batch-columns" aria-hidden="true">
              <span>#</span><span>位置</span><span>方法</span><span>操作</span><span>HEADER 名称</span><span>HEADER 值</span><span></span>
            </div>
            <div id="batchRows" class="batch-rows"></div>

            <button class="forge-button" type="submit">
              <span>应用这一批规则</span>
              <b aria-hidden="true">↗</b>
            </button>
          </form>
        </section>

        <section class="targets-section" aria-labelledby="targetListTitle">
          <div class="section-heading list-heading">
            <div class="index">02</div>
            <div>
              <p>ROUTING TABLE</p>
              <h2 id="targetListTitle">页面 URL 规则</h2>
            </div>
            <button id="clearAll" class="text-button" type="button">清空全部</button>
          </div>

          <div id="emptyState" class="empty-state">
            <div class="empty-radar"><i></i></div>
            <div>
              <strong>等待第一条路由</strong>
              <p>在上方输入页面 URL，并一次添加多条 Header。</p>
            </div>
          </div>
          <div id="targetList" class="target-list" aria-live="polite"></div>
        </section>
      </main>

      <footer>
        <span>DNR / MANIFEST V3</span>
        <span>DATA STAYS LOCAL</span>
      </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
